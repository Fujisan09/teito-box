<title>TEITO BOX お試し版</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
[hidden]{display:none!important}img{max-width:100%}
/* Layout: a working ledger. Sticky header + tab rail, dense tables, detail in a side sheet. */
:root{
  /* TEITO BOX: truck blue + cream livery */
  --bg:#f4efdf; --paper:#ffffff; --fg:#17243a; --mute:#5c6778; --line:#dcd3b8;
  --accent:#1c5fb5; --accent-ink:#ffffff; --tint:#e3ecf8; --cream:#efe4bf;
  --ok:#2e7d4f; --warn:#b26a00; --bad:#b3261e; --okbg:#e3f1e8; --warnbg:#fbf0dc; --badbg:#fbe4e2;
  --sans:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a2b; --paper:#172539; --fg:#f1ead3; --mute:#9fa9ba; --line:#2d3d57;
  --accent:#6ea8ef; --accent-ink:#0b1626; --tint:#213452; --cream:#3a3a2a;
  --ok:#6fcf97; --warn:#e8b04c; --bad:#f28b82; --okbg:#1c2f24; --warnbg:#33290f; --badbg:#3a1e1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a2b; --paper:#172539; --fg:#f1ead3; --mute:#9fa9ba; --line:#2d3d57;
  --accent:#6ea8ef; --accent-ink:#0b1626; --tint:#213452; --cream:#3a3a2a;
  --ok:#6fcf97; --warn:#e8b04c; --bad:#f28b82; --okbg:#1c2f24; --warnbg:#33290f; --badbg:#3a1e1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;max-width:1200px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:4px solid var(--accent)}
.logo{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.02em;flex:none}
.brand b span{color:var(--accent)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;letter-spacing:.02em}
.brand small{color:var(--mute);font-size:12px}
.badge{display:inline-block;font-size:11px;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--accent);font-weight:500}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:6px;white-space:nowrap;cursor:pointer;color:var(--mute);font-weight:500}
nav.tabs button[aria-selected="true"]{background:var(--tint);color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{display:flex;flex-direction:column;gap:16px}
h2{font-size:16px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0;color:var(--mute);font-weight:500;letter-spacing:.04em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 160px;min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .k{font-size:11px;color:var(--mute);letter-spacing:.06em}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--mute);font-family:var(--sans);margin-left:4px}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:11px;color:var(--mute);letter-spacing:.06em;font-weight:500;background:var(--cream)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.code{font-family:var(--mono)}
tr.rowbtn{cursor:pointer}
tr.rowbtn:hover td{background:var(--tint)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);min-width:0}
label.f input,label.f select,label.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-size:14px;width:100%}
label.f.mono input{font-family:var(--mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:110px;height:110px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;max-width:100%}
.thumb{width:48px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--line);vertical-align:middle;display:block}
.jpmap{width:100%;max-width:720px;height:auto;display:block;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.jpmap path{fill:var(--cream);stroke:var(--line);stroke-width:.6}
.jpmap .pin{fill:var(--accent);stroke:#fff;stroke-width:1.2;cursor:pointer}
.jpmap .pin.out{fill:var(--mute)}
.jpmap text{font-size:7px;fill:var(--fg);pointer-events:none;font-family:var(--sans)}
.jpmap text.pinno{font-size:7px;font-weight:700;fill:#fff;font-family:var(--mono)}
.maplist .no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--mono);font-size:12px;font-weight:600;margin-right:8px;vertical-align:middle}
.maplist .no.out{background:var(--mute)}
.jpmap.pick{cursor:crosshair}
.maplist{display:flex;flex-direction:column;gap:6px}
.maplist button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 10px;cursor:pointer}
.empty{color:var(--mute);padding:20px;text-align:center}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end}
.sheet .panel{background:var(--paper);width:min(620px,100%);height:100%;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.sheet .panel>.row.head{position:sticky;top:0;background:var(--paper);padding-bottom:8px;border-bottom:1px solid var(--line);z-index:1}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px}
.kv div:nth-child(odd){color:var(--mute)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;font-size:13px;max-width:90%}
.gate{max-width:420px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox img{max-width:95%;max-height:95%;object-fit:contain}
.note{font-size:12px;color:var(--mute)}
.confirm{background:var(--warnbg);border:1px solid var(--warn);border-radius:6px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{display:grid;grid-template-columns:90px 60px 1fr;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}
@media (max-width:600px){.kv{grid-template-columns:90px 1fr}}

.login{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
#setup{max-width:560px;margin:40px auto}
@media print{header.top,nav,.btn,#overlay{display:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="logo">TB</div><div class="brand"><b>TEITO <span>BOX</span></b><small id="whSub">帝都運輸機工 預かり品 保管管理</small></div>

</div></header>

async function localRpc(action,payload){payload=payload||{};const d=demoStore();const ok=PW!==null&&PW===d.auth;const E=m=>{throw new Error(m)};

async function save(path,data){const [col,id]=path.split("/");try{await rpc("set",{col,id,data});const i=S[col]?S[col].findIndex(x=>x.id===id):-1;if(col==="settings")S.settings={...S.settings,...data};else if(i>=0)S[col][i]=data;else if(S[col])S[col].push(data);if(!(tab==="in"&&canWrite))render()}catch(e){if(e.message==="auth"){PW=null;sessionStorage.removeItem("tb_pw");render();toast("ログインし直してください")}else toast("保存に失敗しました: "+e.message);throw e}}
async function del(path){const [col,id]=path.split("/");try{await rpc("del",{col,id});if(S[col])S[col]=S[col].filter(x=>x.id!==id);if(col==="items")S.moves=S.moves.filter(m=>m.itemId!==id);render()}catch(e){toast("削除に失敗しました");throw e}}
function nextNo(){let max=0;S.items.forEach(i=>{const m=/^A-(\d+)$/.exec(i.no||"");if(m)max=Math.max(max,+m[1])});return "A-"+String(max+1).padStart(5,"0")}
function siteOf(id){return S.sites.find(s=>s.id===id)}
function itemRemaining(it){return it.qty}

/* ---------- billing ---------- */
function monthRange(m){const [y,mo]=m.split("-").map(Number);const last=new Date(y,mo,0).getDate();return [m+"-01",m+"-"+String(last).padStart(2,"0"),last]}
function feeFor(it,m){ // returns {days,fee}
  const [ms,me,len]=monthRange(m);const a=it.inDate>ms?it.inDate:ms;const b=(it.outDate&&it.outDate<me)?it.outDate:me;
  if(!it.inDate||a>b)return {days:0,fee:0};
  const days=dayDiff(a,b)+1;const rate=Number(S.settings.rate)||0;const area=Number(it.area)||0;
  if(S.settings.billing==="monthly")return {days,fee:area*rate};
  return {days,fee:area*rate*days/len};
}
function totalFee(it){ // whole stay
  if(!it.inDate)return 0;const end=it.outDate||today();const days=dayDiff(it.inDate,end)+1;const rate=Number(S.settings.rate)||0,area=Number(it.area)||0;
  if(S.settings.billing==="monthly"){const months=Math.max(Number(S.settings.minMonth)||1,Math.ceil(days/30));return area*rate*months}
  return area*rate*days/30;
}

async function addMove(it,type,qty,date,memo){const mid="m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await save("moves/"+mid,{id:mid,itemId:it.id,no:it.no,siteId:it.siteId,type,qty,date,memo:memo||"",createdAt:new Date().toISOString()})}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const mk=(max,q)=>{let w=img.width,h=img.height;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);return c.toDataURL("image/jpeg",q)};res({full:mk(1024,.75),thumb:mk(160,.6)});URL.revokeObjectURL(u)};img.onerror=rej;img.src=u})}
async function uploadPhoto(itemId,p){const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await rpc("set",{col:"photos",id,data:{id,itemId,b64:p.full}});return {id,thumb:p.thumb}}

async function fullPhoto(id){if(photoCache[id])return photoCache[id];const r=await rpc("photo",{id,code:gateSite&&gateSite.code,pin:gateSite&&gateSite.pin});photoCache[id]=r.b64;return r.b64}

function jpMapSVG(sites,opt={}){const M=window.JP_MAP;if(!M)return `<div class="note">地図データが読み込めませんでした</div>`;

  return `<svg id="jpmap" class="jpmap ${opt.pick?"pick":""}" viewBox="${M.vb}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="日本地図">${M.p.map(x=>`<path d="${x[2]}"><title>${x[1]}</title></path>`).join("")}${pins}</svg>`}

  });

  ${rows.length?rows.map((r,ri)=>`<div class="card"><div class="row"><b>${esc(r.s.contractor)}</b> <span>${esc(r.s.site)}</span><span class="mono" style="margin-left:auto;font-size:16px;font-weight:600">${yen(r.fee)}</span><button class="btn sm" data-inv="${ri}">請求書を保存</button></div>
    <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>預かり番号</th><th>品名</th><th class="num">面積㎡</th><th>期間</th><th class="num">日数</th><th class="num">金額</th></tr></thead><tbody>${r.lines.map(({i,r})=>`<tr><td class="code">${esc(i.no)}</td><td>${esc(i.name)}</td><td class="num">${(+i.area||0).toFixed(1)}</td><td>${fmtD(i.inDate)}〜${i.outDate?fmtD(i.outDate):""}</td><td class="num">${r.days}</td><td class="num">${yen(r.fee)}</td></tr>`).join("")}</tbody></table></div></div>`).join(""):`<div class="empty">この月に保管料が発生する預かり品はありません。</div>`}`;
  $("#bm").onchange=e=>{billMonth=e.target.value||ym();vBill()};
  main.querySelectorAll("[data-inv]").forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.inv];downloadText(`請求書_${billMonth}_${r.s.contractor}.html`,invoiceHTML([r]))});
  $("#allInv").onclick=()=>{if(!rows.length){toast("この月に請求する現場がありません");return}downloadText(`請求書一括_${billMonth}.html`,invoiceHTML(rows))};

}

  if($("#e_del"))$("#e_del").onclick=()=>{$("#e_conf").innerHTML=`<div class="confirm">この預かり品の記録と履歴を削除しますか？元に戻せません。<button class="btn sm danger" id="e_yes">削除する</button></div>`;$("#e_yes").onclick=async()=>{for(const m of S.moves.filter(m=>m.itemId===id))await del("moves/"+m.id);await del("items/"+id);toast("削除しました");closeSheet()}};
}

/* ---------- sheets, downloads, documents ---------- */
function sheet(html){overlay.innerHTML=`<div class="sheet" id="sheetBg"><div class="panel">${html}</div></div>`;$("#close").onclick=closeSheet;$("#sheetBg").onclick=e=>{if(e.target.id==="sheetBg")closeSheet()};document.addEventListener("keydown",escClose)}
function escClose(e){if(e.key==="Escape")closeSheet()}
function closeSheet(){overlay.innerHTML="";document.removeEventListener("keydown",escClose)}
function csv(rows){return "﻿"+rows.map(r=>r.map(v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\r\n")}
function downloadText(name,text){if(/\.html$/.test(name)){let w=null;try{w=window.open("","_blank")}catch(e){}if(w&&w.document){w.document.open();w.document.write(text);w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(e){}},600);return}
  overlay.innerHTML=`<div class="sheet" id="sheetBg"><div class="panel" style="width:min(820px,100%);padding:0"><div class="row head" style="padding:10px 14px"><b>${esc(name.replace(/\.html$/,""))}</b><span class="note">印刷は Ctrl+P（⌘P）</span><button class="btn sm" id="close" style="margin-left:auto">閉じる</button></div><iframe id="slipFrame" style="flex:1;border:0;width:100%;min-height:80vh;background:#fff"></iframe></div></div>`;$("#close").onclick=closeSheet;$("#slipFrame").srcdoc=text;return}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exportCSV(list){downloadText("預かり品一覧_"+today()+".csv",csv([["預かり番号","状態","ゼネコン","現場","所長","品名","数量","単位","面積㎡","棚番","預け主","受入日","出庫日","保管日数","保管料累計","備考"],...list.map(i=>{const s=siteOf(i.siteId)||{};return [i.no,i.status==="out"?"出庫済":"保管中",s.contractor,s.site,i.manager||s.manager||"",i.name,i.qty,i.unit,i.area,i.location,i.person,i.inDate,i.outDate||"",i.inDate?dayDiff(i.inDate,i.outDate||today())+1:0,Math.round(totalFee(i)),i.note]})]))}
const docCSS=`<meta charset="utf-8"><style>body{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;color:#111;max-width:720px;margin:24px auto;padding:0 20px;font-size:13px}h1{font-size:20px;letter-spacing:.2em;text-align:center;border-bottom:3px solid #1c5fb5;padding-bottom:6px;color:#17243a}.tb{font-size:10px;color:#1c5fb5;letter-spacing:.2em;text-align:right}table{border-collapse:collapse;width:100%;margin:10px 0}th,td{border:1px solid #333;padding:6px 8px;text-align:left}th{background:#efe4bf;font-weight:500;width:28%}.r{text-align:right}.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}.sig{display:flex;gap:16px;margin-top:28px}.sig div{flex:1;border:1px solid #333;height:70px;padding:4px;font-size:11px}.ph{display:flex;gap:8px;flex-wrap:wrap}.ph img{width:150px;height:150px;object-fit:cover;border:1px solid #999}.hint{font-size:11px;color:#666;text-align:center;margin-top:20px}@media print{.hint{display:none}}</style>`;
function companyBlock(){const s=S.settings;return `<div><b>${esc(s.company||"")}</b><br>${esc(s.warehouse||"")}<br>${esc(s.address||"")}${s.tel?"<br>TEL "+esc(s.tel):""}</div>`}
function slipHTML(it,type){const s=siteOf(it.siteId)||{};const photos=(it.photos||[]).map(p=>`<img src="${thumbSrc(p)}" alt="">`).join("");const out=S.moves.filter(m=>m.itemId===it.id&&m.type==="out");
  return `<!doctype html><html lang="ja"><head><title>${type==="in"?"預かり証":"出庫伝票"} ${esc(it.no)}</title>${docCSS}</head><body>
  <div class="tb">TEITO BOX</div><h1>${type==="in"?"預 か り 証":"出 庫 伝 票"}</h1>
  <div class="head"><div>${esc(s.contractor||"")} 御中<br>${esc(s.site||"")}${(it.manager||s.manager)?"<br>所長 "+esc(it.manager||s.manager)+" 様":""}${it.person?"<br>担当: "+esc(it.person)+" 様":""}</div>${companyBlock()}</div>
  <table><tr><th>預かり番号</th><td>${esc(it.no)}</td></tr><tr><th>品名</th><td>${esc(it.name)}</td></tr><tr><th>${type==="in"?"受入数量":"出庫数量"}</th><td>${type==="in"?it.qtyIn:out.reduce((a,m)=>a+m.qty,0)} ${esc(it.unit)}</td></tr><tr><th>保管面積</th><td>${(+it.area||0).toFixed(1)} ㎡</td></tr><tr><th>受入日</th><td>${fmtD(it.inDate)}</td></tr>${type==="out"?`<tr><th>出庫日</th><td>${fmtD(it.outDate)}</td></tr><tr><th>保管日数</th><td>${dayDiff(it.inDate,it.outDate)+1} 日</td></tr><tr><th>保管料</th><td>${yen(totalFee(it))}（${yen(S.settings.rate)}/㎡/月・${S.settings.billing==="monthly"?"月単位":"日割り"}）</td></tr>`:`<tr><th>保管料単価</th><td>${yen(S.settings.rate)} / ㎡ / 月（${S.settings.billing==="monthly"?"月単位":"日割り"}）</td></tr>`}<tr><th>置場</th><td>${esc(it.location||"")}</td></tr><tr><th>備考</th><td>${esc(it.note||"")}</td></tr></table>
  ${photos?`<div class="ph">${photos}</div>`:""}
  <div class="sig"><div>受入担当（倉庫）</div><div>${type==="in"?"預け主（現場）":"引取者（現場）"}</div></div>
  <p class="hint">印刷画面が開かない場合は Ctrl+P（Macは⌘P）を押してください。</p></body></html>`}
function invoiceHTML(rows){const [ms,me]=monthRange(billMonth);const st=S.settings;const tax=(+st.tax||0)/100;
  const pages=rows.map((r,i)=>{const taxAmt=r.fee*tax;const no="INV-"+billMonth.replace("-","")+"-"+(r.s.code||"000");
  return `<section class="page"><div class="tb">TEITO BOX</div><h1>御 請 求 書</h1>
  <div class="head"><div><b style="font-size:15px">${esc(r.s.contractor)} 御中</b><br>${esc(r.s.site)} 作業所<br>${r.s.address?esc(r.s.address)+"<br>":""}${r.s.manager?"所長 "+esc(r.s.manager)+" 様":""}<br><br>請求番号: ${no}<br>発行日: ${fmtD(today())}<br>対象期間: ${fmtD(ms)} 〜 ${fmtD(me)}<br>お支払期限: ${esc(st.dueText||"翌月末日")}</div>${companyBlock()}${st.invoiceNo?`<div style="font-size:11px">登録番号 ${esc(st.invoiceNo)}</div>`:""}</div>
  <p>下記のとおり保管料をご請求申し上げます。</p><p><b style="font-size:20px">ご請求金額 ${yen(r.fee+taxAmt)}</b>（税込）</p>
  <table><tr><th style="width:auto">預かり番号</th><th style="width:auto">品名</th><th class="r" style="width:auto">面積㎡</th><th style="width:auto">期間</th><th class="r" style="width:auto">日数</th><th class="r" style="width:auto">金額</th></tr>${r.lines.map(({i,r:x})=>`<tr><td>${esc(i.no)}</td><td>${esc(i.name)}</td><td class="r">${(+i.area||0).toFixed(1)}</td><td>${fmtD(i.inDate)}〜${i.outDate?fmtD(i.outDate):""}</td><td class="r">${x.days}</td><td class="r">${yen(x.fee)}</td></tr>`).join("")}<tr><td colspan="5" class="r">小計（税抜）</td><td class="r">${yen(r.fee)}</td></tr><tr><td colspan="5" class="r">消費税（${st.tax||0}%）</td><td class="r">${yen(taxAmt)}</td></tr><tr><td colspan="5" class="r"><b>合計（税込）</b></td><td class="r"><b>${yen(r.fee+taxAmt)}</b></td></tr></table>
  <p>保管料単価 ${yen(st.rate)} / ㎡ / 月（${st.billing==="monthly"?"月単位":"日割り計算"}）</p>${st.bank?`<p><b>お振込先</b><br>${esc(st.bank).replace(/\n/g,"<br>")}</p>`:""}</section>`}).join("");
  return `<!doctype html><html lang="ja"><head><title>請求書 ${billMonth}</title>${docCSS}<style>.page{page-break-after:always;break-after:page;margin-bottom:40px;border-bottom:1px dashed #999;padding-bottom:20px}.page:last-of-type{page-break-after:auto;border:0}@media print{.page{border:0;margin:0}}</style>${pages}<p class="hint">${rows.length}件の請求書。印刷画面が開かない場合は Ctrl+P（Macは⌘P）を押してください。</p></body></html>`}
/* ---------- boot ---------- */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderAdmin()});
(async()=>{

  PW=sessionStorage.getItem("tb_pw");
  if(PW){try{await rpc("login");canWrite=true;isOwner=true;await reload();return}catch(e){PW=null;sessionStorage.removeItem("tb_pw")}}
  if(location.hash==="#admin"){renderAdminLogin();return}
  let g=null;try{g=JSON.parse(localStorage.getItem("teitobox_gate")||"null")}catch(e){}
  if(g){try{const d=await rpc("site_view",{code:g.c,pin:g.p});S.settings={...S.settings,...d.settings};S.sites=[d.site];S.items=d.items;S.moves=d.moves;gateSite=d.site}catch(e){}}
  render();
})();
})();
</script>
</body></html>
